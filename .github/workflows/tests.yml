name: tests

on:
  push:
  pull_request:

jobs:
  shared:
    name: shared (must pass)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -m shared

  all:
    name: all tests (must pass)
    runs-on: ubuntu-latest
    # Con los cinco flujos implementados, cualquier test en rojo es una regresión.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  front:
    name: front (must pass)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # El mismo contrato que usa el front, contra la API de este repo.
      - run: npm run test:contract:real

  progress:
    name: progress ${{ matrix.flow }}
    runs-on: ubuntu-latest
    # Es normal que los flujos estén en rojo hasta que se terminen: no bloquean el PR.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        flow: [flow_catalog, flow_products, flow_categories, flow_orders, flow_reports]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -m ${{ matrix.flow }} -q
